# Builds and tests every push to main and every pull request.
# The exe is kept as a short-lived workflow artifact; it is not a release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    steps:
      # Official actions only, pinned to exact commits (tags can be moved; commits cannot).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Test
        shell: pwsh
        run: dotnet test DeviceBatteryTray.slnx -c Release

      - name: Publish
        shell: pwsh
        run: >-
          dotnet publish src/DeviceBatteryTray/DeviceBatteryTray.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:ContinuousIntegrationBuild=true
          -o dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DeviceBatteryTray-dev-${{ github.sha }}
          path: dist/DeviceBatteryTray.exe
          if-no-files-found: error
          retention-days: 14
